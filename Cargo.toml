[package]
name = "simple_database"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
percent-encoding = "2.3.2"
postgres = "0.19.14"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
webpki-roots = "1.0.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sdb"
path = "src/main.rs"

[[bin]]
name = "sdb-gui"
path = "src/gui/main.rs"
